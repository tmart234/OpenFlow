name: Cross-validate Model

# Leave-water-years-out cross-validation of the training recipe
# (openFlowML/crossval.py): every water year is held out once and all
# held-out forecasts are pooled into one report. Use it to decide a model or
# input change -- the default test split behind quality_report holds only
# about two snow seasons. Run it once per setting and compare the two
# cv_report.json artifacts with `python openFlowML/crossval.py --compare a b`.

on:
  workflow_dispatch:
    inputs:
      folds:
        description: 'Number of water-year blocks'
        default: '5'
      members:
        description: 'Networks per fold (train.py ships 3)'
        default: '1'
      disable_band:
        description: 'Point forecast only (OPENFLOW_BAND=0)'
        type: boolean
        default: false
      disable_river_skip:
        description: 'Shared upstream skip only (OPENFLOW_RIVER_SKIP=0)'
        type: boolean
        default: false
      enable_smap:
        description: 'Also fetch NASA SMAP L3 HDF5 soil moisture (opt-in; continuous ERA5-Land SM is already enabled)'
        type: boolean
        default: false
      disable_upstream:
        description: 'Skip upstream-gauge inputs (ablation)'
        type: boolean
        default: false
      disable_basin_precip:
        description: 'Skip basin zone rain/snow inputs (ablation)'
        type: boolean
        default: false
      disable_energy:
        description: 'Skip gridMET srad/PET/VPD energy inputs (ablation)'
        type: boolean
        default: false
      disable_hydro_forcing:
        description: 'Skip continuous SM + hourly rain intensity inputs (ablation)'
        type: boolean
        default: false
      disable_gridded_swe:
        description: 'Skip elevation-band gridded SWE inputs (ablation)'
        type: boolean
        default: false
      disable_prior:
        description: 'Skip NWM/RFC forecast prior inputs (ablation)'
        type: boolean
        default: false
      disable_real_forecasts:
        description: 'Train decoder on observed weather only (disable reforecast injection)'
        type: boolean
        default: false
      hydro_source:
        description: 'Continuous SM + hourly rain source (era5 or nldas)'
        type: choice
        options: ['era5', 'nldas']
        default: 'era5'
      mode:
        description: 'CV split strategy (water-year or leave-basin-out zero-shot transfer)'
        type: choice
        options: ['water-year', 'leave-basin-out']
        default: 'water-year'
      use_static_attributes:
        description: 'Enable Phase 5 static catchment attribute MLP (static_input)'
        type: boolean
        default: false
      specific_discharge:
        description: 'Normalize flow as specific discharge (mm/day) before log1p'
        type: boolean
        default: false
      lstm_units:
        description: 'LSTM hidden width (64 default; 128-256 for regional runs)'
        type: string
        default: '64'
      station_dropout:
        description: 'StationDropout rate (0.1 default; 0.3 for regional transfer)'
        type: string
        default: '0.1'
      site_ids_file:
        description: 'Site list file (default .github/site_ids.txt; e.g. .github/site_ids_regional.txt)'
        type: string
        default: '.github/site_ids.txt'

concurrency:
  group: crossval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crossval:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r openFlowML/requirements.txt -c openFlowML/constraints-train.txt
        pip install earthaccess h5py shapely pyarrow -c openFlowML/constraints-train.txt

    - name: Restore feature store cache (if available)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        CACHE_DIR="$RUNNER_TEMP/openflow_dataset_cache"
        mkdir -p "$CACHE_DIR"
        if gh release download dataset-cache --repo "$GITHUB_REPOSITORY" \
            --pattern dataset_cache.tar.gz --dir "$RUNNER_TEMP" 2>/dev/null; then
          tar -xzf "$RUNNER_TEMP/dataset_cache.tar.gz" -C "$CACHE_DIR"
          rm -f "$RUNNER_TEMP/dataset_cache.tar.gz"
          echo "Restored dataset-cache release into $CACHE_DIR"
        else
          echo "No dataset-cache release yet; fetching fresh data"
        fi

    - name: Cross-validate
      env:
        EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
        EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        OPENFLOW_DISABLE_SMAP: ${{ (!inputs.enable_smap || secrets.EARTHDATA_USERNAME == '') && '1' || '' }}
        OPENFLOW_DISABLE_UPSTREAM: ${{ inputs.disable_upstream && '1' || '' }}
        OPENFLOW_DISABLE_BASIN_PRECIP: ${{ inputs.disable_basin_precip && '1' || '' }}
        OPENFLOW_DISABLE_ENERGY: ${{ inputs.disable_energy && '1' || '' }}
        OPENFLOW_DISABLE_HYDRO_FORCING: ${{ inputs.disable_hydro_forcing && '1' || '' }}
        OPENFLOW_DISABLE_GRIDDED_SWE: ${{ inputs.disable_gridded_swe && '1' || '' }}
        OPENFLOW_DISABLE_PRIOR: ${{ inputs.disable_prior && '1' || '' }}
        OPENFLOW_HYDRO_SOURCE: ${{ inputs.hydro_source || 'era5' }}
        OPENFLOW_TRAIN_REAL_FORECASTS: ${{ inputs.disable_real_forecasts && '0' || '1' }}
        OPENFLOW_BAND: ${{ inputs.disable_band && '0' || '1' }}
        OPENFLOW_RIVER_SKIP: ${{ inputs.disable_river_skip && '0' || '1' }}
        OPENFLOW_STATIC_ATTRIBUTES: ${{ inputs.use_static_attributes && '1' || '0' }}
        OPENFLOW_SPECIFIC_DISCHARGE: ${{ inputs.specific_discharge && '1' || '0' }}
        OPENFLOW_LSTM_UNITS: ${{ inputs.lstm_units || '64' }}
        OPENFLOW_STATION_DROPOUT: ${{ inputs.station_dropout || '0.1' }}
        OPENFLOW_SITE_IDS_FILE: ${{ inputs.site_ids_file || '.github/site_ids.txt' }}
        OPENFLOW_CACHE_DIR: ${{ runner.temp }}/openflow_dataset_cache
      working-directory: openFlowML
      run: |
        python crossval.py --fetch --base-path "$GITHUB_WORKSPACE" \
          --mode "${{ inputs.mode || 'water-year' }}" \
          --folds "${{ inputs.folds }}" --members "${{ inputs.members }}"
        cat "$GITHUB_WORKSPACE/cv_report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cv_report
        path: |
          ./cv_report.json
          ./cv_report.md
        if-no-files-found: warn

name: Weekly ML Training

on:
  schedule:
    - cron: '0 0 * * 1' # Run weekly at midnight on Monday
  # A push to a train/** branch trains on that commit (artifacts + quality
  # report). Lets a collaborator or an automation without workflow-dispatch
  # permission start a run: git push origin HEAD:train/<name>. Runs on dev
  # and main are published by the Release Model workflow; a train/** run is
  # published only when someone releases it by run ID.
  push:
    branches: ['train/**']
  workflow_dispatch:
    inputs:
      enable_smap:
        description: 'Also fetch NASA SMAP L3 HDF5 soil moisture (opt-in; continuous ERA5-Land SM is already enabled)'
        type: boolean
        default: false
      disable_drought:
        description: 'Skip USDM drought (ablation)'
        type: boolean
        default: false
      disable_reservoir:
        description: 'Skip USBR reservoir (ablation)'
        type: boolean
        default: false
      disable_upstream:
        description: 'Skip upstream-gauge inputs (ablation)'
        type: boolean
        default: false
      disable_basin_precip:
        description: 'Skip basin zone rain/snow inputs (ablation)'
        type: boolean
        default: false
      disable_energy:
        description: 'Skip gridMET srad/PET/VPD energy inputs (ablation)'
        type: boolean
        default: false
      disable_hydro_forcing:
        description: 'Skip continuous SM + hourly rain intensity inputs (ablation)'
        type: boolean
        default: false
      disable_gridded_swe:
        description: 'Skip elevation-band gridded SWE inputs (ablation)'
        type: boolean
        default: false
      disable_prior:
        description: 'Skip NWM/RFC forecast prior inputs (ablation)'
        type: boolean
        default: false
      hydro_source:
        description: 'Continuous SM + hourly rain source (era5 or nldas)'
        type: choice
        options: ['era5', 'nldas']
        default: 'era5'
      train_real_forecasts:
        description: 'Inject cached real archived weather forecasts into decoder training'
        type: boolean
        default: true
      live_forcing:
        description: 'Also score the held-out model on archived real forecasts (Open-Meteo, 2024 on)'
        type: boolean
        default: false
      training_years:
        description: 'Years of historical data to train on'
        type: string
        default: '25'
      use_static_attributes:
        description: 'Enable Phase 5 static catchment attribute MLP (static_input; opt-in)'
        type: boolean
        default: false
      specific_discharge:
        description: 'Normalize flow as specific discharge (mm/day) before log1p (Phase 5; opt-in)'
        type: boolean
        default: false
      lstm_units:
        description: 'LSTM hidden width (64 default; 128-256 for 50-100+ river regional runs)'
        type: string
        default: '64'
      station_dropout:
        description: 'StationDropout rate (0.1 default; 0.3 for regional zero-shot transfer)'
        type: string
        default: '0.1'
      site_ids_file:
        description: 'Site list file (default .github/site_ids.txt; e.g. .github/site_ids_regional.txt)'
        type: string
        default: '.github/site_ids.txt'

concurrency:
  group: ml-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Publishing is the Release Model workflow's job; training only reads.
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      # earthaccess + h5py + shapely are needed when SMAP / NLDAS is opted in,
      # and h5py + pyarrow are used for Stage IV / Feature Store Parquet files.
      # constraints-train.txt keeps numpy 1.x / typing-extensions <4.6 for
      # tensorflow 2.13 across both installs (an unpinned earthaccess pulls
      # numpy 2, which breaks `import tensorflow`).
      run: |
        python -m pip install --upgrade pip
        pip install -r openFlowML/requirements.txt -c openFlowML/constraints-train.txt
        pip install earthaccess h5py shapely pyarrow -c openFlowML/constraints-train.txt
        python -c "import numpy, tensorflow as tf; print('numpy', numpy.__version__, 'tensorflow', tf.__version__)"

    - name: Restore feature store Actions cache (fallback)
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/openflow_dataset_cache
        key: openflow-feature-store-v3-${{ inputs.site_ids_file || '.github/site_ids.txt' }}-${{ inputs.hydro_source || 'era5' }}-${{ github.run_id }}
        restore-keys: |
          openflow-feature-store-v3-${{ inputs.site_ids_file || '.github/site_ids.txt' }}-${{ inputs.hydro_source || 'era5' }}-

    - name: Restore feature store cache (if available)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        CACHE_DIR="$RUNNER_TEMP/openflow_dataset_cache"
        mkdir -p "$CACHE_DIR"
        if gh release download dataset-cache --repo "$GITHUB_REPOSITORY" \
            --pattern dataset_cache.tar.gz --dir "$RUNNER_TEMP" 2>/dev/null; then
          tar -xzf "$RUNNER_TEMP/dataset_cache.tar.gz" -C "$CACHE_DIR"
          rm -f "$RUNNER_TEMP/dataset_cache.tar.gz"
          echo "Restored dataset-cache release into $CACHE_DIR"
        else
          echo "No dataset-cache release yet; using Actions cache or fetching fresh data"
        fi
        df -h / "$RUNNER_TEMP"

    - name: Train model
      env:
        EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
        EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        # SMAP L3 global HDF5 downloads (~100 MB/day, ~420 GB over 2015+) are
        # opt-in because continuous ERA5-Land soil moisture (sm_surface /
        # sm_rootzone) already covers all 25 years with zero auth. Using
        # !inputs.enable_smap keeps SMAP off on schedule, push, and default
        # manual runs even when Earthdata secrets are configured.
        OPENFLOW_DISABLE_SMAP: ${{ (!inputs.enable_smap || secrets.EARTHDATA_USERNAME == '') && '1' || '' }}
        OPENFLOW_DISABLE_DROUGHT: ${{ inputs.disable_drought && '1' || '' }}
        OPENFLOW_DISABLE_RESERVOIR: ${{ inputs.disable_reservoir && '1' || '' }}
        OPENFLOW_DISABLE_UPSTREAM: ${{ inputs.disable_upstream && '1' || '' }}
        OPENFLOW_DISABLE_BASIN_PRECIP: ${{ inputs.disable_basin_precip && '1' || '' }}
        OPENFLOW_DISABLE_ENERGY: ${{ inputs.disable_energy && '1' || '' }}
        OPENFLOW_DISABLE_HYDRO_FORCING: ${{ inputs.disable_hydro_forcing && '1' || '' }}
        OPENFLOW_DISABLE_GRIDDED_SWE: ${{ inputs.disable_gridded_swe && '1' || '' }}
        OPENFLOW_DISABLE_PRIOR: ${{ inputs.disable_prior && '1' || '' }}
        OPENFLOW_HYDRO_SOURCE: ${{ inputs.hydro_source || 'era5' }}
        OPENFLOW_TRAIN_REAL_FORECASTS: ${{ (github.event_name != 'workflow_dispatch' || inputs.train_real_forecasts) && '1' || '0' }}
        OPENFLOW_LIVE_FORCING: ${{ inputs.live_forcing && '1' || '' }}
        OPENFLOW_TRAINING_YEARS: ${{ inputs.training_years || '25' }}
        OPENFLOW_STATIC_ATTRIBUTES: ${{ inputs.use_static_attributes && '1' || '0' }}
        OPENFLOW_SPECIFIC_DISCHARGE: ${{ inputs.specific_discharge && '1' || '0' }}
        OPENFLOW_LSTM_UNITS: ${{ inputs.lstm_units || '64' }}
        OPENFLOW_STATION_DROPOUT: ${{ inputs.station_dropout || '0.1' }}
        OPENFLOW_SITE_IDS_FILE: ${{ inputs.site_ids_file || '.github/site_ids.txt' }}
        OPENFLOW_CACHE_DIR: ${{ runner.temp }}/openflow_dataset_cache
        OPENFLOW_MODEL_VERSION: model-${{ github.run_number }}
      run: |
        python openFlowML/train.py
        df -h / "$RUNNER_TEMP"

    - name: Save feature store Actions cache
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/openflow_dataset_cache
        key: openflow-feature-store-v3-${{ inputs.site_ids_file || '.github/site_ids.txt' }}-${{ inputs.hydro_source || 'era5' }}-${{ github.run_id }}

    # train.py scores the model on held-out test windows in cfs, per station
    # and lead day, against persistence and the upstream-change reference
    # (quality_report.json / .md, see openFlowML/evaluate.py). A model that
    # fails the gate (worse than "no change", or flattening floods) is not
    # published; its artifacts still upload below for inspection.
    - name: Quality gate
      id: quality
      continue-on-error: true
      working-directory: openFlowML
      run: |
        python evaluate.py --base-path "$GITHUB_WORKSPACE" --gate | tee -a "$GITHUB_STEP_SUMMARY"
        exit "${PIPESTATUS[0]}"

    - name: Export mobile artifacts (CoreML + TFLite + manifest)
      id: export
      # Best-effort: a Phase 6 regression must NOT lose the trained .h5. A
      # failure here still uploads the .h5 below, then turns the run red so
      # the Release Model workflow does not publish it.
      continue-on-error: true
      env:
        OPENFLOW_MODEL_VERSION: model-${{ github.run_number }}
      working-directory: openFlowML
      run: python -m export_mobile --base-path "$GITHUB_WORKSPACE"

    # Everything inference needs, plus the quality report. The Release Model
    # workflow (release_model.yml) publishes this artifact as a GitHub Release
    # after a successful run on dev/main, or on demand for any run.
    - name: Upload model and inference artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lstm_model_keras_release
        path: |
          ./lstm_model.h5
          ./lstm_model.mlpackage.zip
          ./lstm_model.tflite
          ./lstm_model_int8.tflite
          ./scalers.json
          ./station_index.json
          ./basin_index.json
          ./training_config.json
          ./upstream_gauges.json
          ./basin_zones.json
          ./station_attributes.json
          ./manifest.json
          ./quality_report.json
          ./quality_report.md
        if-no-files-found: warn

    # Per-station hindcast charts (highest-flow held-out test window, model
    # forecast vs what happened, peak called out) for eyeballing each run.
    - name: Upload hindcast charts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hindcast_charts
        path: ./charts/*.png
        if-no-files-found: warn

    # Uploads ran first (always()), so a failed gate or export still leaves
    # the model downloadable for inspection; the run then goes red and the
    # Release Model workflow does not publish it.
    - name: Fail the run when the quality gate or the mobile export failed
      if: steps.quality.outcome == 'failure' || steps.export.outcome == 'failure'
      run: |
        echo "quality gate: ${{ steps.quality.outcome }}, mobile export: ${{ steps.export.outcome }}"
        exit 1

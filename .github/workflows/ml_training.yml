name: Weekly ML Training

on:
  schedule:
    - cron: '0 0 * * 1' # Run weekly at midnight on Monday
  # A push to a train/** branch trains on that commit (artifacts + quality
  # report). Lets a collaborator or an automation without workflow-dispatch
  # permission start a run: git push origin HEAD:train/<name>. Runs on dev
  # and main are published by the Release Model workflow; a train/** run is
  # published only when someone releases it by run ID.
  push:
    branches: ['train/**']
  workflow_dispatch:
    inputs:
      disable_smap:
        description: 'Skip SMAP soil moisture (ablation)'
        type: boolean
        default: false
      disable_drought:
        description: 'Skip USDM drought (ablation)'
        type: boolean
        default: false
      disable_reservoir:
        description: 'Skip USBR reservoir (ablation)'
        type: boolean
        default: false
      disable_upstream:
        description: 'Skip upstream-gauge inputs (ablation)'
        type: boolean
        default: false
      disable_basin_precip:
        description: 'Skip basin zone rain/snow inputs (ablation)'
        type: boolean
        default: false
      live_forcing:
        description: 'Also score the held-out model on archived real forecasts (Open-Meteo, 2024 on)'
        type: boolean
        default: false

concurrency:
  group: ml-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    # Publishing is the Release Model workflow's job; training only reads.
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      # earthaccess + h5py + shapely are needed for the SMAP soil-moisture
      # fetch wired into combine_data. They are installed AFTER tensorflow so
      # pip resolves the shared transitive deps (notably typing-extensions)
      # against the tensorflow pin. If the version resolver cannot find a
      # compatible earthaccess, combine_data still runs -- the SMAP fetch
      # silently degrades to "no data" and soil_moisture defaults to 0.
      # constraints-train.txt keeps numpy 1.x / typing-extensions <4.6 for
      # tensorflow 2.13 across both installs (an unpinned earthaccess pulls
      # numpy 2, which breaks `import tensorflow`).
      run: |
        python -m pip install --upgrade pip
        pip install -r openFlowML/requirements.txt -c openFlowML/constraints-train.txt
        pip install earthaccess h5py shapely -c openFlowML/constraints-train.txt
        python -c "import numpy, tensorflow as tf; print('numpy', numpy.__version__, 'tensorflow', tf.__version__)"

    - name: Train model
      env:
        EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
        EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        # SMAP needs Earthdata credentials; without the secrets, switch it
        # off explicitly so training_config records it and inference mirrors it.
        OPENFLOW_DISABLE_SMAP: ${{ (inputs.disable_smap || secrets.EARTHDATA_USERNAME == '') && '1' || '' }}
        OPENFLOW_DISABLE_DROUGHT: ${{ inputs.disable_drought && '1' || '' }}
        OPENFLOW_DISABLE_RESERVOIR: ${{ inputs.disable_reservoir && '1' || '' }}
        OPENFLOW_DISABLE_UPSTREAM: ${{ inputs.disable_upstream && '1' || '' }}
        OPENFLOW_DISABLE_BASIN_PRECIP: ${{ inputs.disable_basin_precip && '1' || '' }}
        OPENFLOW_LIVE_FORCING: ${{ inputs.live_forcing && '1' || '' }}
        OPENFLOW_MODEL_VERSION: model-${{ github.run_number }}
      run: python openFlowML/train.py

    # train.py scores the model on held-out test windows in cfs, per station
    # and lead day, against persistence and the upstream-change reference
    # (quality_report.json / .md, see openFlowML/evaluate.py). A model that
    # fails the gate (worse than "no change", or flattening floods) is not
    # published; its artifacts still upload below for inspection.
    - name: Quality gate
      id: quality
      continue-on-error: true
      working-directory: openFlowML
      run: |
        python evaluate.py --base-path "$GITHUB_WORKSPACE" --gate | tee -a "$GITHUB_STEP_SUMMARY"
        exit "${PIPESTATUS[0]}"

    - name: Export mobile artifacts (CoreML + TFLite + manifest)
      id: export
      # Best-effort: a Phase 6 regression must NOT lose the trained .h5. A
      # failure here still uploads the .h5 below, then turns the run red so
      # the Release Model workflow does not publish it.
      continue-on-error: true
      env:
        OPENFLOW_MODEL_VERSION: model-${{ github.run_number }}
      working-directory: openFlowML
      run: python -m export_mobile --base-path "$GITHUB_WORKSPACE"

    # Everything inference needs, plus the quality report. The Release Model
    # workflow (release_model.yml) publishes this artifact as a GitHub Release
    # after a successful run on dev/main, or on demand for any run.
    - name: Upload model and inference artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lstm_model_keras_release
        path: |
          ./lstm_model.h5
          ./lstm_model.mlpackage.zip
          ./lstm_model.tflite
          ./lstm_model_int8.tflite
          ./scalers.json
          ./station_index.json
          ./basin_index.json
          ./training_config.json
          ./upstream_gauges.json
          ./basin_zones.json
          ./manifest.json
          ./quality_report.json
          ./quality_report.md
        if-no-files-found: warn

    # Per-station hindcast charts (highest-flow held-out test window, model
    # forecast vs what happened, peak called out) for eyeballing each run.
    - name: Upload hindcast charts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hindcast_charts
        path: ./charts/*.png
        if-no-files-found: warn

    # Uploads ran first (always()), so a failed gate or export still leaves
    # the model downloadable for inspection; the run then goes red and the
    # Release Model workflow does not publish it.
    - name: Fail the run when the quality gate or the mobile export failed
      if: steps.quality.outcome == 'failure' || steps.export.outcome == 'failure'
      run: |
        echo "quality gate: ${{ steps.quality.outcome }}, mobile export: ${{ steps.export.outcome }}"
        exit 1

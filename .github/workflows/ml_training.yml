name: Weekly ML Training

on:
  schedule:
    - cron: '0 0 * * 1' # Run weekly at midnight on Monday
  # A push to a train/** branch trains on that commit (artifacts + quality
  # report; publishing a release still happens only from main). Lets a
  # collaborator or an automation without workflow-dispatch permission start
  # a run: git push origin HEAD:train/<name>.
  push:
    branches: ['train/**']
  workflow_dispatch:
    inputs:
      disable_smap:
        description: 'Skip SMAP soil moisture (ablation)'
        type: boolean
        default: false
      disable_drought:
        description: 'Skip USDM drought (ablation)'
        type: boolean
        default: false
      disable_reservoir:
        description: 'Skip USBR reservoir (ablation)'
        type: boolean
        default: false
      disable_upstream:
        description: 'Skip upstream-gauge inputs (ablation)'
        type: boolean
        default: false
      disable_basin_precip:
        description: 'Skip basin zone rain/snow inputs (ablation)'
        type: boolean
        default: false

concurrency:
  group: ml-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    # contents:write is needed for softprops/action-gh-release to tag and
    # publish the trained model artifacts as a GitHub Release.
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Fetch tags so the release-tag collision check ("does model-YYYY.MM.DD
        # already exist?") can see existing release tags.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      # earthaccess + h5py + shapely are needed for the SMAP soil-moisture
      # fetch wired into combine_data. They are installed AFTER tensorflow so
      # pip resolves the shared transitive deps (notably typing-extensions)
      # against the tensorflow pin. If the version resolver cannot find a
      # compatible earthaccess, combine_data still runs -- the SMAP fetch
      # silently degrades to "no data" and soil_moisture defaults to 0.
      # constraints-train.txt keeps numpy 1.x / typing-extensions <4.6 for
      # tensorflow 2.13 across both installs (an unpinned earthaccess pulls
      # numpy 2, which breaks `import tensorflow`).
      run: |
        python -m pip install --upgrade pip
        pip install -r openFlowML/requirements.txt -c openFlowML/constraints-train.txt
        pip install earthaccess h5py shapely -c openFlowML/constraints-train.txt
        python -c "import numpy, tensorflow as tf; print('numpy', numpy.__version__, 'tensorflow', tf.__version__)"

    - name: Train model
      env:
        EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
        EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        # SMAP needs Earthdata credentials; without the secrets, switch it
        # off explicitly so training_config records it and inference mirrors it.
        OPENFLOW_DISABLE_SMAP: ${{ (inputs.disable_smap || secrets.EARTHDATA_USERNAME == '') && '1' || '' }}
        OPENFLOW_DISABLE_DROUGHT: ${{ inputs.disable_drought && '1' || '' }}
        OPENFLOW_DISABLE_RESERVOIR: ${{ inputs.disable_reservoir && '1' || '' }}
        OPENFLOW_DISABLE_UPSTREAM: ${{ inputs.disable_upstream && '1' || '' }}
        OPENFLOW_DISABLE_BASIN_PRECIP: ${{ inputs.disable_basin_precip && '1' || '' }}
        OPENFLOW_MODEL_VERSION: model-${{ github.run_number }}
      run: python openFlowML/train.py

    # train.py scores the model on held-out test windows in cfs, per station
    # and lead day, against persistence and the upstream-change reference
    # (quality_report.json / .md, see openFlowML/evaluate.py). A model that
    # fails the gate (worse than "no change", or flattening floods) is not
    # published; its artifacts still upload below for inspection.
    - name: Quality gate
      id: quality
      continue-on-error: true
      working-directory: openFlowML
      run: |
        python evaluate.py --base-path "$GITHUB_WORKSPACE" --gate | tee -a "$GITHUB_STEP_SUMMARY"
        exit "${PIPESTATUS[0]}"

    - name: Export mobile artifacts (CoreML + TFLite + manifest)
      id: export
      # Best-effort: a Phase 6 regression must NOT lose the trained .h5. The
      # release step is gated on this step's success, so a failure here
      # cleanly skips the release while still uploading the .h5 via the
      # artifact step below.
      continue-on-error: true
      env:
        OPENFLOW_MODEL_VERSION: model-${{ github.run_number }}
      working-directory: openFlowML
      run: python -m export_mobile --base-path "$GITHUB_WORKSPACE"

    - name: Compute release tag
      id: tag
      if: github.ref == 'refs/heads/main' && steps.export.outcome == 'success' && steps.quality.outcome == 'success'
      # Use the UTC date as the base tag and suffix -rN on collision so a
      # same-day re-run still produces a fresh release.
      run: |
        BASE_TAG="model-$(date -u +%Y.%m.%d)"
        TAG="$BASE_TAG"
        N=2
        while git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; do
          TAG="${BASE_TAG}-r${N}"
          N=$((N + 1))
        done
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Publish GitHub Release
      if: github.ref == 'refs/heads/main' && steps.export.outcome == 'success' && steps.quality.outcome == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: Model ${{ steps.tag.outputs.tag }}
        generate_release_notes: true
        # The model is not usable for inference without scalers.json, the
        # station + basin index maps, and training_config.json. All artifacts
        # travel together; manifest.json carries sha256s + schema so the
        # mobile app can verify what it downloaded. See docs/INFERENCE.md.
        # lstm_model_int8.tflite is shipped only if the int8 parity check in
        # export_mobile.py passes; if it didn't ship, softprops/action-gh-release
        # quietly skips the missing file.
        files: |
          lstm_model.h5
          lstm_model.mlpackage.zip
          lstm_model.tflite
          lstm_model_int8.tflite
          scalers.json
          station_index.json
          basin_index.json
          training_config.json
          upstream_gauges.json
          basin_zones.json
          manifest.json
          quality_report.json
          quality_report.md

    # Belt-and-braces: even on release-step failure, the artifact upload
    # keeps the trained model retrievable for debugging the release path.
    - name: Upload model and inference artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lstm_model_keras_release
        path: |
          ./lstm_model.h5
          ./lstm_model.mlpackage.zip
          ./lstm_model.tflite
          ./lstm_model_int8.tflite
          ./scalers.json
          ./station_index.json
          ./basin_index.json
          ./training_config.json
          ./upstream_gauges.json
          ./basin_zones.json
          ./manifest.json
          ./quality_report.json
          ./quality_report.md
        if-no-files-found: warn

    # Per-station hindcast charts (highest-flow held-out test window, model
    # forecast vs what happened, peak called out) for eyeballing each run.
    - name: Upload hindcast charts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hindcast_charts
        path: ./charts/*.png
        if-no-files-found: warn

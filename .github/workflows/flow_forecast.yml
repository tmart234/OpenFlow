name: Flow Forecast

# Daily (and on-demand) weekly forecast + chart for registered stations
# (data/upstream_gauges.json): Lower Taos Box, Royal Gorge, Conejos, Dolores
# (Gateway-Dewey) by default. No trained model needed; when a model-* release
# exists its ML forecast is overlaid on each chart. The CSV / JSON / PNG are
# uploaded as a workflow artifact.
#
# Forecast archive: each scheduled run commits the forecasts (OpenFlow
# routing, the NWS official forecast where one exists, and the ML model) to
# the `forecast-archive` branch under archive/YYYY-MM-DD/, then scores the
# last 60 days of archived forecasts against what the rivers did
# (openFlowML/score_archive.py) in the job summary. NWS keeps no archive of
# its past forecasts, so this is how the sources get compared over time.
on:
  schedule:
    - cron: '17 13 * * *'   # daily, ~6:17 AM MST
  workflow_dispatch:
    inputs:
      archive:
        description: 'Also archive these forecasts and score the archive'
        type: boolean
        default: false
      sites:
        description: 'Comma-separated stations: alias, site id, or NWS LID'
        type: string
        default: taos-box,royal-gorge,conejos,dolores
      days:
        description: 'Local calendar days to forecast'
        type: string
        default: '7'

concurrency:
  group: flow-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # download the model release; push the forecast-archive branch
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download the latest trained model release (if any)
      id: model
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Newest published model-* release; pre-releases (test promotions) are skipped.
        TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isPrerelease,isDraft \
              --jq '[.[] | select((.tagName | startswith("model-")) and (.isPrerelease | not) and (.isDraft | not))][0].tagName // empty')
        if [ -n "$TAG" ]; then
          mkdir -p model_release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir model_release \
            --pattern lstm_model.h5 --pattern '*.json'
          echo "dir=model_release" >> "$GITHUB_OUTPUT"
          echo "Using model release $TAG"
        else
          echo "No model-* release yet: charts show the routing / NWS forecast only"
        fi

    - name: Install dependencies
      env:
        HAS_MODEL: ${{ steps.model.outputs.dir }}
      run: |
        python -m pip install --upgrade pip
        if [ -n "$HAS_MODEL" ]; then
          # Full training env (tensorflow) to run the ML model for the overlay.
          pip install -r openFlowML/requirements.txt scipy h5py
        else
          # scipy reads gridMET (NetCDF-3); h5py reads the NWS Stage IV analysis.
          pip install "requests>=2.31.0" "pandas>=2.1.1" "numpy>=1.23" "matplotlib>=3.7" scipy h5py
        fi

    - name: Run forecast
      # Explicit `shell: bash` runs with -o pipefail, so a failing forecast
      # fails the step even though its output is piped through tee.
      shell: bash
      env:
        SITES: ${{ inputs.sites || 'taos-box,royal-gorge,conejos,dolores' }}
        MODEL_DIR: ${{ steps.model.outputs.dir }}
        DAYS: ${{ inputs.days || '7' }}
      run: |
        mkdir -p forecast_out
        IFS=',' read -ra LIST <<< "$SITES"
        for site in "${LIST[@]}"; do
          python openFlowML/flow_forecast.py --site "$(echo "$site" | xargs)" --days "$DAYS" \
            --out-dir forecast_out ${MODEL_DIR:+--model-dir "$MODEL_DIR"} | tee -a forecast_out/summary.txt
          echo >> forecast_out/summary.txt
        done
        { echo '```'; cat forecast_out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload forecast
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: flow_forecast
        path: forecast_out/
        if-no-files-found: warn

    - name: Archive forecasts (forecast-archive branch)
      id: archive
      if: github.event_name == 'schedule' || inputs.archive
      shell: bash
      run: |
        set -euo pipefail
        DAY=$(date -u +%Y-%m-%d)
        if git ls-remote --exit-code --heads origin forecast-archive >/dev/null; then
          git fetch --depth 1 origin forecast-archive
          git worktree add archive-wt FETCH_HEAD
          cd archive-wt && git checkout -q -B forecast-archive
        else
          git worktree add --detach archive-wt
          cd archive-wt && git checkout -q --orphan forecast-archive && git rm -rfq .
        fi
        mkdir -p "archive/$DAY"
        cp ../forecast_out/*_forecast.json ../forecast_out/*_forecast.csv "archive/$DAY/"
        git add archive
        git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          commit -qm "Forecasts $DAY" || echo "Nothing new to archive"
        git push -q origin forecast-archive

    - name: Score archived forecasts
      if: steps.archive.outcome == 'success'
      run: |
        python openFlowML/score_archive.py --archive archive-wt --days 60 --out forecast_out/archive_scores.md
        cat forecast_out/archive_scores.md >> "$GITHUB_STEP_SUMMARY"

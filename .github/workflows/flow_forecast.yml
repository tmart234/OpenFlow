name: Flow Forecast

# On-demand weekly forecast + chart for registered stations
# (data/upstream_gauges.json): Lower Taos Box, Royal Gorge, Conejos by
# default. No trained model needed. The CSV / JSON / PNG are uploaded as a workflow artifact.
# To run it on a schedule, add e.g.:
#   schedule:
#     - cron: '17 13 * * *'   # daily, ~6 AM Mountain
on:
  workflow_dispatch:
    inputs:
      sites:
        description: 'Comma-separated stations: alias, site id, or NWS LID'
        type: string
        default: taos-box,royal-gorge,conejos
      days:
        description: 'Local calendar days to forecast'
        type: string
        default: '7'

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # scipy reads gridMET (NetCDF-3); h5py reads the NWS Stage IV analysis.
        pip install "requests>=2.31.0" "pandas>=2.1.1" "numpy>=1.23" "matplotlib>=3.7" scipy h5py

    - name: Run forecast
      # Explicit `shell: bash` runs with -o pipefail, so a failing forecast
      # fails the step even though its output is piped through tee.
      shell: bash
      env:
        SITES: ${{ inputs.sites || 'taos-box,royal-gorge,conejos' }}
        DAYS: ${{ inputs.days || '7' }}
      run: |
        mkdir -p forecast_out
        IFS=',' read -ra LIST <<< "$SITES"
        for site in "${LIST[@]}"; do
          python openFlowML/flow_forecast.py --site "$(echo "$site" | xargs)" --days "$DAYS" \
            --out-dir forecast_out | tee -a forecast_out/summary.txt
          echo >> forecast_out/summary.txt
        done
        { echo '```'; cat forecast_out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload forecast
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: flow_forecast
        path: forecast_out/
        if-no-files-found: warn

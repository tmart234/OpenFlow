name: Routing Crest Backtest

# Scores the OpenFlow routing forecast (openFlowML/flow_forecast.py) on past
# floods: for every sharp crest since 2015 at each routed station it issues
# forecasts 12-48 h ahead (calibrated on the 28 days before, upstream gauges
# and gridMET rain as perfect forecasts) and checks when and how high the
# forecast puts the crest (openFlowML/crest_backtest.py).
#
# Gate, per station: from 12 h of lead on, the median crest-timing error must
# beat the naive "it crests now" forecast, and the median forecast/observed
# crest ratio must stay within 0.7-1.3. Runs on PRs that change the routing,
# monthly, and on demand.
on:
  pull_request:
    paths:
      - 'openFlowML/routing.py'
      - 'openFlowML/flow_forecast.py'
      - 'openFlowML/crest_backtest.py'
      - 'openFlowML/data/upstream_gauges.json'
      - 'openFlowML/data/get_basin_precip.py'
      - '.github/workflows/routing_backtest.yml'
  schedule:
    - cron: '41 9 2 * *'   # monthly, 2nd of the month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: taos-box
            leads: '12 24 48'
          - site: dolores
            leads: '12 24 48'
          - site: royal-gorge
            leads: '12 24 48'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Hourly USGS / CO DWR records and gridMET basin rain, per station; past
    # years never change, so the cache makes later runs fast.
    - name: Cache gauge and rain data
      uses: actions/cache@v4
      with:
        path: ~/.cache/openflow/hourly
        key: crest-data-${{ matrix.site }}-${{ github.run_id }}
        restore-keys: crest-data-${{ matrix.site }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "requests>=2.31.0" "pandas>=2.1.1" "numpy>=1.23" "matplotlib>=3.7" scipy h5py

    - name: Crest backtest
      working-directory: openFlowML
      run: |
        python crest_backtest.py --site ${{ matrix.site }} --start 2015-01-01 \
          --leads ${{ matrix.leads }} --rain --gate \
          --out "$GITHUB_WORKSPACE/crest_${{ matrix.site }}.csv" --markdown "$GITHUB_STEP_SUMMARY"

    - name: Upload scored forecasts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: crest_backtest_${{ matrix.site }}
        path: crest_${{ matrix.site }}.csv
        if-no-files-found: warn
